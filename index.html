<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPNOTEC PC | VIP Member Preview</title>
<meta name="description" content="IPNOTEC PC — VIP member preview. Enter an IPNOTEC ID to emulate the Address Book, Spend Dashboard, Dream Machine, Astrology and Events included in the ₹1,001/month membership.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ac:#EDEDED;--ac-rgb:237,237,237;--act:#FFFFFF;--on:#000;--bg:#050505;--txt:#F2F2F2;--mut:rgba(255,255,255,.74);--dim:rgba(255,255,255,.52);--bad:#FF7A7A;--good:#4BE07A;--warn:#FFD600;--card:rgba(255,255,255,.035);--line:rgba(var(--ac-rgb),.25);--line2:rgba(255,255,255,.1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
html{font-size:16px}
body{font-family:'Rajdhani',sans-serif;font-weight:500;font-size:1.05rem;line-height:1.45;background:var(--bg);color:var(--txt);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;text-align:inherit}
input,select,textarea{font:inherit}
b{font-weight:700}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(var(--ac-rgb),.45);border-radius:3px}::-webkit-scrollbar-track{background:transparent}
[hidden]{display:none!important}
/* ---------- frame ---------- */
.wallpaper{position:relative;width:100%;height:100vh;height:100dvh;background:radial-gradient(ellipse at 50% 40%,rgba(var(--ac-rgb),.10),#000 70%);display:flex;justify-content:center;align-items:center;overflow:hidden;transition:background .8s}
.gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(var(--ac-rgb),.05) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--ac-rgb),.05) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.scan{position:absolute;left:12%;width:76%;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--ac-rgb),.45),transparent);animation:scan 12s linear infinite;opacity:.5;pointer-events:none}
@keyframes scan{0%{top:0;opacity:0}40%{opacity:.6}100%{top:100%;opacity:0}}
.pc{position:relative;width:97%;max-width:1500px;height:95vh;height:95dvh;background:#0b0b0b;border:1.5px solid var(--ac);border-radius:10px;box-shadow:0 0 50px rgba(var(--ac-rgb),.14);display:flex;flex-direction:column;overflow:hidden;transition:border-color .8s,box-shadow .8s}
body.mono .pc{filter:grayscale(1)}
.screen{flex:1;min-height:0;margin:8px 10px 0;background:#000;border:1px solid rgba(var(--ac-rgb),.14);border-radius:5px;position:relative;overflow:hidden}
.layer{position:absolute;inset:0}
.pcf{height:32px;flex:none;padding:0 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font:600 .66rem Orbitron,sans-serif;letter-spacing:2px}
.pcf .b{color:var(--act);opacity:.85;white-space:nowrap}.pcf .m{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--good);color:var(--good);font-size:.75rem;box-shadow:0 0 8px rgba(75,224,122,.35);text-align:center}
/* ---------- common ui ---------- */
.st{font:700 .8rem Orbitron,sans-serif;letter-spacing:2px;color:var(--act);margin-bottom:8px;text-transform:uppercase}
.sub{color:var(--mut);font-size:1rem}
.small{font-size:.92rem}
.hint{color:var(--dim);font-size:.92rem;margin-top:4px}
.lab{display:block;font:600 .75rem Orbitron,sans-serif;letter-spacing:1.5px;color:var(--act);margin:14px 0 6px}
input,select,textarea{width:100%;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.22);border-radius:4px;color:#fff;font-size:1.02rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--act);background:rgba(var(--ac-rgb),.06)}
textarea{resize:vertical;min-height:120px;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;background:var(--ac);color:var(--on);border:1px solid var(--ac);border-radius:4px;font:700 .75rem Orbitron,sans-serif;letter-spacing:1.5px;transition:filter .2s,transform .2s;text-align:center}
.btn:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.g{background:transparent;color:var(--txt);border-color:rgba(255,255,255,.28)}
.btn.g:hover:not(:disabled){border-color:var(--act);color:var(--act)}
.btn.d{background:transparent;color:var(--bad);border-color:rgba(255,122,122,.5)}
.btn.sm{padding:6px 11px;font-size:.72rem}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid rgba(255,255,255,.2);border-radius:20px;font-size:.98rem;color:var(--mut);background:rgba(255,255,255,.03);transition:.15s}
.chip:hover{border-color:var(--act);color:#fff}
.chip[aria-pressed=true]{border-color:var(--act);color:var(--act);background:rgba(var(--ac-rgb),.13)}
.chip.k{cursor:default;border-color:rgba(var(--ac-rgb),.45);color:var(--act)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.card{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:16px;margin-bottom:14px}
.card.hl{border-color:rgba(var(--ac-rgb),.55);background:rgba(var(--ac-rgb),.06)}
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{padding:12px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--card);min-width:0}
.kpi span{display:block;font:600 .72rem Orbitron,sans-serif;letter-spacing:1.2px;color:var(--dim)}
.kpi b{display:block;font:700 1.45rem Orbitron,sans-serif;color:var(--act);margin:6px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b small{font-size:.6em;opacity:.6}
.kpi>small{color:var(--mut);font-size:.92rem}
.up{color:var(--bad)!important}.down{color:var(--good)!important}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:3px;border:1px solid var(--c,rgba(var(--ac-rgb),.5));color:var(--c,var(--act));font:600 .7rem Orbitron,sans-serif;letter-spacing:1px;white-space:nowrap}
.badge.on{--c:var(--good)}.badge.off{--c:rgba(255,255,255,.45)}.badge.mute{--c:rgba(255,255,255,.4)}.badge.sim{--c:var(--warn)}
.note{font-size:.95rem;color:var(--mut);border-left:3px solid var(--warn);padding:6px 12px;margin:12px 0;line-height:1.45;background:rgba(255,214,0,.04)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:1.02rem}
.kv span:first-child{color:var(--mut)}.kv b{text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:1rem}
.tbl th{position:sticky;top:0;background:#101010;color:var(--act);font:600 .7rem Orbitron,sans-serif;letter-spacing:1px;padding:10px;text-align:left;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.tscroll{max-height:380px;overflow:auto;border:1px solid var(--line2);border-radius:8px}
.seg{display:inline-flex;border:1px solid rgba(var(--ac-rgb),.45);border-radius:4px;overflow:hidden}
.seg button{padding:8px 14px;font:700 .7rem Orbitron,sans-serif;letter-spacing:1px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--on)}
.subtabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.subtabs button{padding:9px 16px;border:1px solid rgba(255,255,255,.18);border-radius:4px;font:600 .74rem Orbitron,sans-serif;letter-spacing:1.5px;color:var(--mut)}
.subtabs button[aria-pressed=true]{border-color:var(--act);color:var(--act);background:rgba(var(--ac-rgb),.1)}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;flex:none;border:1px solid rgba(255,255,255,.4)}
.discl{font-size:.95rem;color:var(--mut);line-height:1.5;border:1px dashed rgba(255,255,255,.22);padding:12px 14px;border-radius:6px;margin-top:6px}
.empty{padding:28px;text-align:center;color:var(--dim)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--mut)}
/* ---------- boot ---------- */
#boot{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:70;cursor:pointer}
.bl{font:900 2.4rem Orbitron,sans-serif;color:var(--act);letter-spacing:6px;text-align:center;text-shadow:0 0 22px rgba(var(--ac-rgb),.45)}
.bl small{display:block;font-size:.8rem;letter-spacing:5px;opacity:.7;margin-top:8px;font-weight:600}
.bb{width:min(420px,70%);height:3px;background:rgba(255,255,255,.08);margin-top:24px;border-radius:2px;overflow:hidden}.bb i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.bs{margin-top:12px;font:.95rem 'Courier New',monospace;color:var(--mut)}
/* ---------- login ---------- */
#login{z-index:60;overflow-y:auto;padding:28px 16px;display:flex;justify-content:center;align-items:flex-start;background:radial-gradient(ellipse at 50% 25%,rgba(255,255,255,.06),#000 70%)}
.lg{width:100%;max-width:680px;text-align:center;margin:auto 0}
.lg h1{font:900 clamp(2.1rem,6vw,3.6rem) Orbitron,sans-serif;letter-spacing:10px;color:#fff;text-shadow:0 0 30px rgba(255,255,255,.25)}
.lg .k{font:600 .8rem Orbitron,sans-serif;letter-spacing:5px;color:var(--mut);margin-top:6px}
.idbox{margin-top:26px;text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:22px}
.idin{padding:16px;font:700 clamp(1.1rem,3.4vw,1.65rem) Orbitron,sans-serif;letter-spacing:4px;text-align:center;background:#000;border:1.5px solid rgba(255,255,255,.32);border-radius:6px;color:#fff}
.idin::placeholder{color:rgba(255,255,255,.25)}
.idin:focus{border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,.16);background:#000}
.idin.bad{border-color:var(--bad)}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.seg3{padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:6px;min-height:74px}
.seg3 .h{font:600 .7rem Orbitron,sans-serif;letter-spacing:2px;color:var(--dim)}
.seg3 .v{margin-top:5px;font-weight:600;font-size:1rem;display:flex;gap:7px;align-items:center;line-height:1.25}
.seg3.ok{border-color:rgba(75,224,122,.55)}.seg3.ok .h{color:var(--good)}
.seg3.bad{border-color:rgba(255,122,122,.6)}.seg3.bad .h{color:var(--bad)}
.err{margin-top:12px;color:var(--bad);font-size:1.02rem;min-height:1.45em}
.lg .lab{color:#fff}
.leg{margin-top:18px;text-align:left}
.leg summary{cursor:pointer;font:600 .75rem Orbitron,sans-serif;letter-spacing:2px;color:var(--mut)}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:12px}
.pl div{display:flex;gap:10px;align-items:center;font-size:.98rem;color:var(--mut)}
.pl b{font:700 .78rem Orbitron,sans-serif;color:#fff;letter-spacing:1px;width:36px}
.legfmt{margin-top:10px;font-size:.98rem;color:var(--mut)}
.legfmt code{font-family:'Courier New',monospace;color:#fff}
/* ---------- auth ---------- */
#auth{z-index:65;background:#000;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
#auth.run .aw{animation:colourin 7s linear both}
@keyframes colourin{from{filter:grayscale(1)}to{filter:grayscale(0)}}
.aw{width:100%;max-width:820px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:30px;align-items:center}
.ring{position:relative;width:200px;height:200px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 2.1rem Orbitron,sans-serif;color:var(--act)}
.ring .pct small{font:600 .72rem Orbitron,sans-serif;letter-spacing:2px;color:var(--mut);margin-top:4px}
.aid{font:900 clamp(1.25rem,3.4vw,2rem) Orbitron,sans-serif;letter-spacing:4px;color:var(--act);text-shadow:0 0 20px rgba(var(--ac-rgb),.5);word-break:break-all}
.alog{margin-top:14px;font:1rem 'Courier New',monospace;line-height:1.8;color:var(--mut);min-height:18em}
.alog div{white-space:pre-wrap;animation:fadein .3s both}
.alog em{color:var(--good);font-style:normal}.alog b{color:var(--act);font-weight:400}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
/* ---------- desktop ---------- */
#desk{bottom:48px;overflow-y:auto;padding:22px 3vw 28px;background:radial-gradient(ellipse at 50% 15%,rgba(var(--ac-rgb),.08),rgba(0,0,0,.97) 70%)}
.dw{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;justify-content:space-between;margin-bottom:18px}
.logo h1{font:900 clamp(1.9rem,4vw,3.1rem) Orbitron,sans-serif;letter-spacing:8px;color:var(--act);text-shadow:0 0 30px rgba(var(--ac-rgb),.4);animation:pulse 4s infinite alternate}
.logo h1 span{font-size:.45em;letter-spacing:5px;color:#fff;margin-left:8px}
.logo .tag{font:600 .78rem Orbitron,sans-serif;letter-spacing:4px;color:var(--mut);margin-top:4px}
@keyframes pulse{to{text-shadow:0 0 55px rgba(var(--ac-rgb),.7)}}
.who{text-align:right}
.who .hi{font-size:1.3rem;font-weight:600}
.who .idl{font:700 1rem Orbitron,sans-serif;letter-spacing:3px;color:var(--act);margin:2px 0 8px}
.pchip{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:20px;font:600 .72rem Orbitron,sans-serif;letter-spacing:1.2px;color:var(--act)}
.hero{display:flex;gap:18px;align-items:center;width:100%;padding:20px 22px;margin-bottom:14px;background:linear-gradient(135deg,rgba(var(--ac-rgb),.16),rgba(var(--ac-rgb),.04));border:1.5px solid var(--ac);border-radius:10px;box-shadow:0 0 28px rgba(var(--ac-rgb),.12);transition:.25s}
.hero:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(var(--ac-rgb),.28)}
.hero.on{animation:glow 1.6s infinite alternate}
@keyframes glow{to{box-shadow:0 0 60px rgba(var(--ac-rgb),.55)}}
.hic{font-size:2.6rem;flex:none}
.hx{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.ht{font:700 .95rem Orbitron,sans-serif;letter-spacing:2.5px;color:var(--act)}
.hb{font-size:1.2rem;font-weight:600}
.hb b{color:var(--act)}
.hs{color:var(--mut)}
.hcd{flex:none;text-align:center;padding:10px 16px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.4);min-width:110px}
.hcd b{display:block;font:900 2rem Orbitron,sans-serif;color:var(--act)}
.hcd small{font:600 .68rem Orbitron,sans-serif;letter-spacing:1.5px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:14px}
.tile{display:flex;flex-direction:column;gap:4px;padding:16px;background:var(--card);border:1px solid var(--line2);border-radius:8px;transition:.2s}
.tile:hover{border-color:var(--act);background:rgba(var(--ac-rgb),.08);transform:translateY(-2px)}
.tile .th{display:flex;align-items:center;gap:10px;font:700 .78rem Orbitron,sans-serif;letter-spacing:2px;color:var(--act)}
.tile .th i{font-style:normal;font-size:1.3rem}
.tile .tb{font:700 1.35rem Orbitron,sans-serif;color:#fff;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{color:var(--mut);font-size:.98rem;line-height:1.35}
.bl6{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.bn{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line2);border-radius:6px;background:rgba(0,0,0,.3)}
.bn:hover{border-color:var(--act)}
.bn>span{font-weight:700;color:var(--dim);font-size:1.1rem;line-height:1.2}
.bn.ok>span{color:var(--good)}
.bn b{display:block;font-size:1.02rem}.bn small{display:block;color:var(--mut);font-size:.92rem}
.term{background:rgba(4,4,4,.95);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.term .tt{padding:7px 12px;border-bottom:1px solid var(--line2);display:flex;gap:6px;align-items:center;background:rgba(var(--ac-rgb),.04)}
.term .tt i{width:10px;height:10px;border-radius:50%}
.term .tt span{flex:1;text-align:center;font:600 .7rem Orbitron,sans-serif;letter-spacing:2px;color:var(--act)}
.term pre{padding:12px 16px;font:.95rem 'Courier New',monospace;line-height:1.7;color:var(--mut);white-space:pre-wrap}
.term pre b{color:var(--act);font-weight:400}.term pre em{color:var(--good);font-style:normal}
.url{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font:600 .68rem Orbitron,sans-serif;letter-spacing:3px;color:var(--dim)}
/* ---------- dock ---------- */
.dock{position:absolute;left:0;right:0;bottom:0;height:48px;display:flex;justify-content:flex-start;align-items:center;gap:4px;background:rgba(0,0,0,.95);border-top:1px solid var(--line2);padding:0 8px;z-index:50;overflow-x:auto}
.dock>:first-child{margin-left:auto}.dock>:last-child{margin-right:auto}
.tab{flex:none;position:relative;padding:8px 14px;border:1px solid transparent;border-radius:4px;font:600 .72rem Orbitron,sans-serif;letter-spacing:1.2px;color:var(--mut)}
.tab:hover{color:#fff;border-color:var(--line)}
.tab.act{color:var(--act);background:rgba(var(--ac-rgb),.12);border-color:rgba(var(--ac-rgb),.4)}
.tab.rem::after{content:"";position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--act)}
.tab.out{color:var(--dim);margin-left:10px}
/* ---------- window ---------- */
#win{inset:8px 8px 56px 8px;background:#060606;border:1px solid var(--ac);border-radius:8px;box-shadow:0 0 30px rgba(var(--ac-rgb),.12);z-index:40;display:flex;flex-direction:column;overflow:hidden}
.wh{height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.wh h2{flex:1;font:700 .85rem Orbitron,sans-serif;letter-spacing:3px;color:var(--act);outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh .x{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.25);color:var(--mut);font-size:1rem;text-align:center;flex:none}
.wh .x:hover{border-color:var(--bad);color:var(--bad)}
.wh .idt{font:600 .7rem Orbitron,sans-serif;letter-spacing:2px;color:var(--dim);white-space:nowrap}
.wbody{flex:1;overflow-y:auto;padding:18px 20px}
.status{flex:none;min-height:32px;padding:6px 16px;font-size:1rem;color:var(--act);border-top:1px solid var(--line2);background:rgba(0,0,0,.6)}
/* ---------- address book ---------- */
.bday{text-align:center;border:1.5px solid var(--ac);background:linear-gradient(180deg,rgba(var(--ac-rgb),.14),rgba(var(--ac-rgb),.03))}
.bday.on{animation:glow 1.6s infinite alternate}
.bday .cake{font-size:2.6rem}
.bday .big{font-size:1.35rem;font-weight:700;margin:4px 0}
.bday .bdate{font:900 1.35rem Orbitron,sans-serif;color:var(--act);letter-spacing:2px;margin:6px 0}
.bday .cd{font:700 1.05rem Orbitron,sans-serif;letter-spacing:1px;padding:10px;border:1px solid var(--line);border-radius:6px;background:rgba(0,0,0,.45);margin:10px 0}
.steps{padding-left:20px;color:var(--mut)}.steps li{margin:5px 0}.steps b{color:#fff}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{max-width:300px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.cc{position:relative;padding:12px 14px;border-radius:7px;border:1px solid var(--line2);background:var(--card)}
.cc.p1{border-color:rgba(var(--ac-rgb),.55);background:rgba(var(--ac-rgb),.08)}
.cc.p2{border-color:rgba(255,255,255,.22)}
.cc b{display:block;padding-right:40px;font-size:1.06rem}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled&&ACT[b.dataset.a])ACT[b.dataset.a]({...b.dataset},e)});
document.addEventListener('input',e=>{const el=e.target,i=el.id;
 if(i==='idin'){const pos=el.selectionStart,v=el.value.toUpperCase().replace(/\s/g,'');if(v!==el.value){el.value=v;try{el.setSelectionRange(pos,pos)}catch(x){}}L.val=v;if(L.err){L.err='';$('#lerr').textContent='';el.classList.remove('bad')}$('#segs').innerHTML=segHTML(v)}
 else if(i==='dm-text'){const d=UI.dm.draft;d.text=el.value;if(d.summary){d.summary='';d.kw=null;render()}else{const c=$('#dm-cnt');if(c)c.textContent=d.text.trim().length;const s=$('#dm-sum');if(s)s.disabled=d.text.trim().length<30}}
 else if(i==='dm-date')UI.dm.draft.date=el.value;
 else if(i==='ci-amt'||i==='ci-detail'||i==='ci-note')UI.ci[i.slice(3)]=el.value;
 else if(i==='ab-q'){UI.ab.q=el.value;render()}
 else if(i==='dv-note'){const x=D.dejavu.find(z=>z.id===UI.dm.dvLast);if(x){x.note=el.value;save()}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='idin'){e.preventDefault();verify();return}
 if(e.key==='Escape'&&D&&UI.app){if(UI.app==='ab'&&UI.ab.view==='cer')ACT.cerClose();else if(UI.app==='dm'&&UI.dm.open)ACT.dmBack();else ACT.close()}});
/* live countdown + day rollover */
let lastDay=today();
setInterval(()=>{const c=$('#cd');if(c&&D)c.textContent=cdText();if(!D)return;const t=today();
 if(t!==lastDay){lastDay=t;migrate(D);save();if(UI.app)render();else rDesk();return}
 if(UI.app==='ab'&&UI.ab.view==='main'&&UI.ab.st&&UI.ab.st!==IPC.lockState(D.lock,t))render()},1000);
boot();
if(location.search.includes('test'))console.table(IPC.tests());
})();
</script>
